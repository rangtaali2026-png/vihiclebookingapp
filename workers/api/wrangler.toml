name = "plant-transit-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
FRONTEND_URL = "https://vehiclebookingapp.pages.dev"
CORS_ORIGINS = "https://vehiclebookingapp.pages.dev,http://localhost:3000"

[[queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "vehicle-notifications-prod"

[observability]
enabled = true
