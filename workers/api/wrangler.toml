name = "plant-transit-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
FRONTEND_URL = "https://vehiclebookingapp.pages.dev"
CORS_ORIGINS = "https://vehiclebookingapp.pages.dev,https://*.vehiclebookingapp.pages.dev,http://localhost:3000"
SUPABASE_URL = "https://uylsnmghommcvsxejyru.supabase.co"

[[queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "vehicle-notifications-prod"

[observability]
enabled = true

# Phase 9: Automated Daily Shift Bus Generator Cron
[triggers]
crons = ["0 18 * * *", "0 6 * * *"]
